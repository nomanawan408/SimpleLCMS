name: CI/CD Pipeline

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  # ─── CI: Test & Build (passes on every push/PR) ──────────────
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: simplelaw_test
          MYSQL_USER: simplelaw
          MYSQL_PASSWORD: simplelaw_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, bcmath, pdo_mysql, curl, zip, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build frontend assets
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations (CI local DB)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: simplelaw_test
          DB_USERNAME: simplelaw
          DB_PASSWORD: simplelaw_pass
        run: php artisan migrate:fresh --seed --force

      - name: Run tests (CI local DB)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: simplelaw_test
          DB_USERNAME: simplelaw
          DB_PASSWORD: simplelaw_pass
        run: php artisan test --parallel

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build
          retention-days: 3

  # ─── Deploy to Hostinger (law.simplehr.services) ────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy via SSH (passphrase-less key, npm build + migrate on host)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            set -e
            echo "→ Deploy to ${{ secrets.HOSTINGER_PATH }} on $(hostname) as $(whoami)"
            cd ${{ secrets.HOSTINGER_PATH }}

            echo "→ PHP version (must be 8.4):"
            /opt/alt/php84/usr/bin/php -v
            echo "→ Node version:"
            node -v || echo "Node not found — build will be skipped (use CI artifact if needed)"
            echo "→ Git pull:"
            git fetch origin main
            git reset --hard origin/main

            echo "→ Composer install (production) with PHP 8.4:"
            /opt/alt/php84/usr/bin/php /usr/local/bin/composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction || composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            echo "→ NPM build on host (as you ran: npm ci && npm run build):"
            npm ci --prefer-offline --no-audit
            npm run build

            echo "→ Storage link:"
            /opt/alt/php84/usr/bin/php artisan storage:link || true

            echo "→ Maintenance down:"
            /opt/alt/php84/usr/bin/php artisan down --render="errors::503" || true

            echo "→ Migrate (RUN_MIGRATIONS=true):"
            /opt/alt/php84/usr/bin/php artisan migrate --force

            echo "→ Cache rebuild:"
            /opt/alt/php84/usr/bin/php artisan optimize:clear
            /opt/alt/php84/usr/bin/php artisan config:cache
            /opt/alt/php84/usr/bin/php artisan route:cache
            /opt/alt/php84/usr/bin/php artisan view:cache

            echo "→ Queue/Horizon restart (if used):"
            /opt/alt/php84/usr/bin/php artisan horizon:terminate || true
            /opt/alt/php84/usr/bin/php artisan queue:restart || true

            echo "→ Maintenance up:"
            /opt/alt/php84/usr/bin/php artisan up || true

            echo "→ Healthcheck:"
            curl -fsS https://law.simplehr.services/health || curl -fsS https://law.simplehr.services/ || echo "Healthcheck warning: /health not configured"

            echo "✓ Deployment complete to law.simplehr.services"
