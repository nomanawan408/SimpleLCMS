<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SimpleLaw scales of justice logo mark</title>
  <desc>A flat minimal scales-of-justice mark for SimpleLaw case management, drawn in the Legl teal palette with a transparent background</desc>

  <!-- finial -->
  <circle cx="128" cy="54" r="9" fill="#34E5BD"/>

  <!-- beam -->
  <rect x="66" y="66" width="124" height="11" rx="5.5" fill="#06C29A"/>

  <!-- pillar -->
  <rect x="122" y="60" width="12" height="126" rx="6" fill="#01B88E"/>

  <!-- hanging strings -->
  <line x1="76" y1="77" x2="60" y2="114" stroke="#34E5BD" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="77" x2="196" y2="114" stroke="#34E5BD" stroke-width="6" stroke-linecap="round"/>

  <!-- pans -->
  <path d="M34 118 A24 24 0 0 0 82 118 Z" fill="#01B88E"/>
  <path d="M174 118 A24 24 0 0 0 222 118 Z" fill="#01B88E"/>

  <!-- base -->
  <rect x="92" y="186" width="72" height="14" rx="7" fill="#018F70"/>
</svg>
